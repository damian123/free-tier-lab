#cloud-config
package_update: true
package_upgrade: true

apt:
  sources:
    docker:
      # Docker release signing key (fingerprint 9DC8 5822 9FC7 DD38 854A E2D8 8D81 803C 0EBF CD88)
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
      source: "deb [arch=arm64] https://download.docker.com/linux/ubuntu noble stable"

packages:
  - ca-certificates
  - curl
  - fail2ban
  - git
  - jq
  - unattended-upgrades
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin

write_files:
  - path: /etc/ssh/sshd_config.d/90-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
      X11Forwarding no
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h

runcmd:
  - [usermod, -aG, docker, ubuntu]
  - [systemctl, enable, --now, docker]
  - [systemctl, enable, --now, fail2ban]
  - [systemctl, restart, ssh]

final_message: "free-tier-lab bootstrap completed after $UPTIME seconds"
